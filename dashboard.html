  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: #111; border: 1px solid #222; border-radius: 6px; padding: 12px; }
  .card .label { color: #666; font-size: 0.65em; text-transform: uppercase; letter-spacing: 1px; }
  .card .value { color: #00ff88; font-size: 1.6em; font-weight: bold; margin-top: 4px; }
  .card .sub { color: #888; font-size: 0.7em; margin-top: 2px; }
  .section { margin-bottom: 20px; }
  .section h2 { color: #00ff88; font-size: 0.9em; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .section h2 .badge { background: #00ff88; color: #0a0a0a; font-size: 0.6em; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; font-size: 0.75em; }
  th { text-align: left; color: #666; font-weight: normal; text-transform: uppercase; font-size: 0.65em; letter-spacing: 1px; padding: 5px 6px; border-bottom: 1px solid #222; }
  td { padding: 5px 6px; border-bottom: 1px solid #1a1a1a; }
  tr:hover td { background: #151515; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; background: #1a1a1a; border: 1px solid #333; border-radius: 3px; padding: 1px 6px; font-size: 0.7em; margin: 1px; }
  .tag.h0 { border-color: #00ff88; color: #00ff88; }
  .tag.h1 { border-color: #ffaa00; color: #ffaa00; }
  .tag.h2 { border-color: #ff6666; color: #ff6666; }
  .tag.skill { border-color: #6688ff; color: #6688ff; }
  .tag.money { border-color: #ffcc00; color: #ffcc00; }
  .tag.live { border-color: #00ff88; color: #00ff88; }
  .tag.blocked { border-color: #ff4444; color: #ff4444; }
  .bar { height: 6px; background: #00ff88; border-radius: 3px; margin-top: 4px; }
  .bar-bg { height: 6px; background: #1a1a1a; border-radius: 3px; width: 100%; }
  .dist-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 0.75em; }
  .dist-label { width: 80px; color: #888; }
  .dist-bar { flex: 1; }
  .dist-count { width: 40px; text-align: right; color: #00ff88; }
  .queue-item { background: #111; border: 1px solid #222; border-radius: 6px; padding: 10px; margin-bottom: 6px; border-left: 3px solid; }
  .queue-item.critical { border-left-color: #ff4444; }
  .queue-item.high { border-left-color: #ffaa00; }
  .queue-item.medium { border-left-color: #00ff88; }
  .queue-item.low { border-left-color: #666; }
  .queue-item input { background: #0a0a0a; border: 1px solid #333; border-radius: 4px; padding: 5px 8px; color: #e0e0e0; font-family: monospace; font-size: 0.8em; }
  .queue-item input:focus { outline: none; border-color: #00ff88; }
  .queue-item button { background: #00ff88; color: #0a0a0a; border: none; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-weight: bold; font-size: 0.75em; }
  .queue-item button:hover { opacity: 0.85; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
  #loading { color: #666; padding: 40px; text-align: center; }

      <div style="background:#111;border:1px solid #222;border-radius:6px;padding:12px;font-size:0.8em">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
          <div>
            <div style="color:#666;font-size:0.7em;text-transform:uppercase;margin-bottom:4px">Execution Stages</div>
            <div style="color:#00ff88">discover → qualify → enter → work → submit → evaluate → settle → outcome</div>
          </div>
          <div>
            <div style="color:#666;font-size:0.7em;text-transform:uppercase;margin-bottom:4px">Resolution Ladder</div>
            <div style="color:#00ff88">official_api → openapi → mcp → webmcp → zapier → community_mcp → browser → human_queue</div>
          </div>
          <div>
            <div style="color:#666;font-size:0.7em;text-transform:uppercase;margin-bottom:4px">Human Levels</div>
            <div style="color:#00ff88">H0 autonomous → H1 one-time setup → H2 per-opportunity → H3 human contributes → H4 human-only</div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function saveToVault(key) {
  const input = document.getElementById('input-' + key);
  const status = document.getElementById('status-' + key);
  if (!input || !input.value.trim()) return;
  status.textContent = 'Saving...';
  status.style.color = '#ffaa00';
  try {
    const resp = await fetch('/api/vault/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key, value: input.value.trim() })
    });
    if (resp.ok) {
      status.textContent = '✓ Saved';
      status.style.color = '#00ff88';
      input.value = '';
    } else {
      status.textContent = '✗ Failed';
      status.style.color = '#ff4444';
    }
  } catch(e) {
    status.textContent = '✗ Use: agent-vault vault credential set ' + key + '="..." --vault oracle';
    status.style.color = '#ff4444';
  }
}

render();
</script>
